# cargo-audit configuration.

[advisories]
# RUSTSEC-2025-0055 (tracing-subscriber 0.2.25: ANSI escape sequences in
# logged user input). tracing-subscriber 0.2 is not compiled into any
# workspace target:
#
#   cargo tree --workspace --all-features --target all -e all \
#       -i tracing-subscriber@0.2.25
#
# prints nothing. It is only recorded in Cargo.lock because ark-bn254 0.5
# (pulled in by revm-precompile) declares the weak feature
# `ark-r1cs-std?/std`, and cargo locks the optional
# ark-r1cs-std -> ark-relations 0.5.1 -> tracing-subscriber chain behind it
# although the `r1cs` feature that would build it is never enabled. The
# legacy Groth16 pool builds ark-relations 0.4 without `std`, so it does not
# use tracing-subscriber either. Drop this entry once revm-precompile moves
# to arkworks 0.6 (tracing-subscriber 0.3).
ignore = ["RUSTSEC-2025-0055"]
