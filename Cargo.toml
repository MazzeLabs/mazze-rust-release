# Use workspace section to allow test all cases under root folder (cargo test --all).
[workspace]
members = [
    "crates/mazze_bytes",
    "crates/mazze_types",
    "crates/mazze_addr",
    "crates/mazze_math",
    "crates/mazze_utils",
    "crates/stratum",
    "crates/accounts",
    "crates/blockgen",
    "crates/mazze_key",
    "crates/mazze_store",
    "crates/dbs/db",
    "crates/dbs/db-errors",
    "crates/network",
    "crates/primitives",
    "crates/secret_store",
    "crates/transactiongen",
    "bins/mazze_store",
    "bins/mazze_key",
    "bins/mazze",
    "crates/mazzecore/core",
    "crates/mazzecore/execute-helper",
    "crates/mazzecore/executor",
    "crates/mazzecore/internal_common",
    "crates/mazzecore/packing-pool",
    "crates/mazzecore/parameters",
    "crates/dbs/statedb",
    "crates/dbs/storage",
    "crates/mazzecore/vm-interpreter",
    "crates/mazzecore/vm-types",
    "crates/mazzecore/eth-vm",
    "crates/util/mazze-vm-tracer-derive",
    "crates/util/dag",
    "crates/util/delegate",
    "crates/util/heap-map",
    "crates/util/hibitset",
    "crates/util/io",
    "crates/util/link-cut-tree",
    "crates/util/log_device",
    "crates/util/malloc_size_of",
    "crates/util/malloc_size_of_derive",
    "crates/util/memory-cache",
    "crates/util/metrics",
    "crates/util/priority-send-queue",
    "crates/util/random_crash",
    "crates/util/runtime",
    "crates/util/sha3-macro",
    "crates/util/solidity-abi",
    "crates/util/solidity-abi-derive",
    "crates/util/throttling",
    "crates/util/treap-map",
    "crates/util/version",
    "crates/serde_utils",
    "crates/mazzecore/geth-tracer", "bins/mazze-miner",
]

resolver = "2"

[workspace.package]
version = "2.1.4"
authors = ["paladin0x"]
description = "A rust implementation of the Mazze-Protocol"
documentation = "https://docs.mazze.io/"
#edition = "2018"
homepage = "https://mazze.io/"
keywords = ["Mazze"]
repository = "https://github.com/MazzeLabs/mazze-rust-release"
license-file = "LICENSE"


[profile.test]
debug-assertions = true

# M-4 migration: replaced the abandoned `parity-secp256k1` fork with
# the upstream `rust-bitcoin/rust-secp256k1` crate workspace-wide.
# Compile the now-canonical `secp256k1` at -O3 in tests so the FFI
# overhead doesn't dominate test runtime.
[profile.test.package]
secp256k1 = { opt-level = 3 }

[profile.bench]
debug-assertions = true
overflow-checks = true

[profile.release]
overflow-checks = true
# Temporarily run with debug assertion before main-net release.
debug-assertions = true

[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "alloc"] }
serde_json = "1.0"

# Alloy modernization (in progress, multi-step):
# Step 1 (done): bump from the early-2024 git rev 4e22b9e (which pinned
# c-kzg 1.x via alloy-consensus) to the crates.io 1.6/2.0 releases.
# These resolve the c-kzg 1.x conflict that was blocking revm 40.
# Step 2 (pending): adjust API imports in geth-tracer, execute-helper,
# mazzecore-core, and client to match the alloy 1.x/2.x module layout.
alloy-primitives = "1.6"
alloy-rpc-types-trace = "2.0"
