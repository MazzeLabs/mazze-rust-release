[package]
name = "mazze-shielded-wallet"
version = "0.1.0"
license = "GPL-3.0"
description = "Wallet for the post-quantum shielded space: keys, scanning, proving, submission"
edition = "2021"

[[bin]]
name = "mazze-shielded-wallet"
path = "src/main.rs"

[[bin]]
name = "mazze-shielded-auditor"
path = "src/auditor.rs"

[dependencies]
mazze-shielded-pq = { path = "../../crates/shielded_pq", features = ["prover"] }
primitives = { path = "../../crates/primitives" }
mazze-types = { path = "../../crates/mazze_types" }
mazze-addr = { path = "../../crates/mazze_addr" }
mazzekey = { path = "../../crates/mazze_key" }
keccak-hash = "0.5"
rlp = "0.4.0"
jsonrpsee = { version = "0.26.1", features = ["http-client"] }
tokio = { version = "1.6", features = ["rt", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
rand = "0.8"
rand10 = { package = "rand", version = "0.10.1", default-features = false, features = ["std_rng"] }
p3-field = "=0.8.0"
# Sealed delivery (spec §9.2-9.3): wallet only, never in the node.
ml-kem = { version = "0.2.3", features = ["deterministic"] }
classic-mceliece-rust = { version = "3.1.0", features = ["mceliece460896", "zeroize"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
rand_chacha = "0.3"
chacha20poly1305 = "0.10"
argon2 = { version = "0.5", features = ["zeroize"] }
rpassword = "5"
zeroize = "1.8"
