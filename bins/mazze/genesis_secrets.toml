# Their compromise is part of the contract — anyone who clones this repo
# can sign transactions as these accounts. That is intentional **for local
# development only**.
#
# Security ground rules:
#   1. Never ship this file inside a release tarball, container image, or
#      installer artifact. A CI guard rejects release pipelines that
#      include it (see docs/security-audit.md §5.4 and Phase F).
#   2. Never reuse these keys for production wallets, testnets, faucets,
#      or any deployment that holds real value.
#   3. Treat this file as if it were public — because it is: every clone
#      of this repository contains it.
#
# Lines starting with `#` and blank lines are skipped by the parser
# (`crates/mazzecore/core/src/genesis_block.rs::load_secrets_file`).
# Each non-comment line below is a 64-character hex secp256k1 secret.
#
# See `docs/security-audit.md` finding C-3 for the full threat-model
# treatment.
