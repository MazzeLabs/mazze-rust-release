[package]
description = "Parity Ethereum Key Management"
name = "mazzestore"
version = "0.2.1"
authors = ["Parity Technologies <admin@parity.io>"]
edition = "2021"

[dependencies]
log = "0.4"
libc = "0.2"
rand = "0.7"
mazze-types = { path = "../mazze_types" }
mazzekey = { path = "../mazze_key" }
serde = "1.0"
serde_json = "1.0"
serde_derive = "1.0"
rustc-hex = "2.1"
tiny-keccak = { version = "2", features = ["keccak"] }
time = "0.1.34"
parking_lot = "0.11"
# M-4 migration: maintained RustCrypto replacements for the
# (now removed) `parity-crypto 0.9.0` dep. Same algorithms — V3
# keystore (PBKDF2/Scrypt + AES-128-CTR + HMAC-SHA256) and the
# Ethereum presale wallet (PBKDF2-SHA256 + AES-128-CBC + Keccak-256)
# stay byte-compatible with existing on-disk keystore files.
aes = "0.8"
ctr = "0.9"
cbc = { version = "0.1", features = ["alloc"] }
block-padding = "0.3"
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
scrypt = { version = "0.11", default-features = false, features = ["std"] }
subtle = "2.5"
dir = { git = "https://github.com/MazzeLabs/mazze-parity-deps", rev = "223e9acc6f7ba9f1b296639f08b326a72d7b92fa"  }
smallvec = "1.4"
parity-wordlist = "1.0"
tempdir = "0.3"

[dev-dependencies]
matches = "0.1"
