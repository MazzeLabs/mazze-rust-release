[package]
name = "mazze-shielded-pq"
version = "0.1.0"
license = "GPL-3.0"
description = "Post-quantum shielded space: field, hashes, proof system PS-1 and its wire format"
edition = "2021"

# The verifier is consensus code: every Plonky3 crate is pinned to an exact
# version, and upgrading one is a consensus change.
[dependencies]
primitives = { path = "../primitives" }
p3-air = "=0.8.0"
p3-challenger = "=0.8.0"
p3-commit = "=0.8.0"
p3-dft = { version = "=0.8.0", features = ["parallel"] }
p3-field = "=0.8.0"
p3-fri = "=0.8.0"
p3-keccak = "=0.8.0"
p3-koala-bear = "=0.8.0"
p3-matrix = "=0.8.0"
p3-merkle-tree = "=0.8.0"
p3-poseidon2 = "=0.8.0"
p3-symmetric = "=0.8.0"
p3-uni-stark = "=0.8.0"
rand = { version = "0.10.1", default-features = false, features = ["std_rng"] }
serde = { version = "1", features = ["derive"] }
tiny-keccak = { version = "2", features = ["shake"] }
chacha20poly1305 = { version = "0.10", optional = true }

[features]
# Witness and trace generation: wallets only, never the node.
prover = ["chacha20poly1305"]

[dev-dependencies]
# Only to check that the wire format equals the bincode configuration the
# proof sizes were measured with.
bincode = "=1.3.3"
p3-security = "=0.8.0"
p3-uni-stark = "=0.8.0"
mazze-types = { path = "../mazze_types" }
rlp = "0.4.0"
# The tests prove, so they need the prover.
mazze-shielded-pq = { path = ".", features = ["prover"] }
