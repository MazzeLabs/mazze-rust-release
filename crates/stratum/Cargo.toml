[package]
description = "Mazze Stratum lib"
homepage = "https://www.mazze.io"
name = "mazze-stratum"
version = "1.12.0"
license = "GPL-3.0"
edition = "2021"

[dependencies]
mazze-types = { path = "../mazze_types" }
mazze-rpc-error = { path = "../util/rpc-error" }
keccak-hash = "0.5"
futures = "0.3"
lazy_static = "1.4"
log = "0.4"
metrics = { path = "../util/metrics" }
parking_lot = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.6", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
env_logger = "0.5"
