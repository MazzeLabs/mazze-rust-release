[package]
name = "parity-version"
# NOTE: this value is used for OpenEthereum version string (via env CARGO_PKG_VERSION)
version = "3.3.3"
authors = ["Parity Technologies <admin@parity.io>"]
build = "build.rs"
edition = "2021"

[package.metadata]

[dependencies]
target_info = "0.1"

[build-dependencies]
anyhow = "1.0"
# git via the git CLI (gitcl), not libgit2 (RUSTSEC-2024-0013 in libgit2-sys).
vergen = { version = "8.3", default-features = false, features = ["git", "gitcl", "rustc"] }
